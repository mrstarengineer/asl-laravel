# Local development stack for the ASL API.
# Start/stop both projects with ../manage-docker.sh, or just this one with `docker compose up -d`.
#
#   API      http://localhost:8080
#   Adminer  http://localhost:8181  (server: db, user: asl, password: secret, database: asl_laravel)
#   MySQL    localhost:3306
#
# Host ports can be changed in .env (API_PORT, ADMINER_PORT, DB_FORWARD_PORT, REDIS_FORWARD_PORT).
name: asl-backend

services:
  backend:
    build:
      context: .
      dockerfile: dev.Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    container_name: asl-backend
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    networks:
      - asl-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    # These win over the same keys in .env, so .env can keep host-style values.
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${API_PORT:-8080}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: asl_laravel
      DB_USERNAME: asl
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # The app asks the storage disk whether each photo exists while listing vehicles and invoices.
      # With the s3 disk and no AWS keys those pages return 500, so local dev defaults to the local disk
      # (lists work, photos are missing). To use the real bucket, put FILESYSTEM_DRIVER=s3 and the AWS_* keys in .env.
      FILESYSTEM_DRIVER: ${FILESYSTEM_DRIVER:-public}

  nginx:
    image: nginx:alpine
    container_name: asl-nginx
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - asl-network
    depends_on:
      - backend

  db:
    # Production and the SQL dump are MySQL 5.7.
    image: mysql:5.7
    container_name: asl-db
    restart: unless-stopped
    # Run as the host user so the data folder below stays readable and removable without sudo.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "${DB_FORWARD_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: asl_laravel
      MYSQL_USER: asl
      MYSQL_PASSWORD: secret
    volumes:
      # The database lives here, on the host. Delete the folder to start again from the seed dump.
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/asl.cnf:ro
      # Runs once, only when docker/mysql/data is empty: imports the newest dump in docker/mysql/seed.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./docker/mysql/seed:/seed:ro
    healthcheck:
      # TCP on purpose: the temporary server used while seeding only listens on the socket,
      # so the container turns healthy after the import has finished.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -psecret --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15m
    networks:
      - asl-network

  redis:
    image: redis:alpine
    container_name: asl-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_FORWARD_PORT:-6379}:6379"
    networks:
      - asl-network

  adminer:
    image: adminer
    container_name: asl-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8181}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks:
      - asl-network
    depends_on:
      - db

networks:
  asl-network:
    name: asl-network
    driver: bridge
